:root{
  --navy:#111111;--ink:#080808;--wood:#138A36;--wood-2:#2DBE60;--ledger:#138A36;--ledger-2:#2DBE60;--paper:#F6F7F4;--chalk:#FFFFFF;--alert:#138A36;
  --bg:var(--paper);--surface:var(--chalk);--surface-2:#ECEFEA;--text:#101828;--muted:#556070;--line:#D9DED6;--hero-bg:var(--navy);--hero-text:#F6F7F4;--accent:var(--wood);--good:var(--ledger);
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:6px;--r-md:10px;--r-lg:16px;--pad:clamp(16px,4vw,40px);--max:1180px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080808;--surface:#161616;--surface-2:#202020;--text:#F0F0F0;--muted:#A3A3A3;--line:#2E2E2E;--hero-bg:#0B0B0B;--good:#2DBE60}}
:root[data-theme="dark"]{--bg:#080808;--surface:#161616;--surface-2:#202020;--text:#F0F0F0;--muted:#A3A3A3;--line:#2E2E2E;--hero-bg:#0B0B0B;--good:#2DBE60}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--wood);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--wood);color:#000;padding:8px 12px;z-index:100}.skip:focus{left:8px}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:800;line-height:.95;letter-spacing:-.005em;margin:0 0 .4em}
h1{font-size:clamp(46px,9vw,108px);text-transform:uppercase}
h2{font-size:clamp(34px,5.5vw,60px);text-transform:uppercase}
h3{font-size:clamp(22px,2.6vw,28px)}
p{margin:0 0 1em;max-width:68ch}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12.5px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
section.band{padding:clamp(48px,8vw,96px) 0}
.band.alt{background:var(--surface-2)}
.band.dark{background:var(--hero-bg);color:var(--hero-text)}
.band.dark .muted{color:#B3B3B3}
.lede{font-size:clamp(17px,2vw,21px);color:var(--muted);max-width:60ch}
.dark .lede{color:#CCCCCC}

/* header */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--hero-bg) 94%,transparent);backdrop-filter:blur(8px);color:var(--hero-text);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:16px;height:62px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.04em}
.brand b{color:var(--wood-2)}.brand span{font-size:14px;font-weight:600;letter-spacing:.02em;opacity:.75}
.topnav{display:flex;gap:4px;margin-left:auto}
.topnav a{text-decoration:none;padding:8px 10px;border-radius:var(--r-sm);font-size:14.5px;opacity:.85}
.topnav a:hover,.topnav a[aria-current="page"]{opacity:1;background:rgba(255,255,255,.08)}
.iconbtn{background:none;border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:var(--r-sm);padding:8px 12px;font:600 14px var(--f-body);cursor:pointer}
@media (max-width:980px){.topnav{display:none}.top .menu-btn{margin-left:auto}}
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.drawer nav{position:absolute;right:0;top:0;bottom:0;width:min(360px,88vw);background:var(--surface);color:var(--text);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
.drawer nav h4{font:700 13px var(--f-body);color:var(--muted);margin:18px 0 6px}
.drawer nav a{display:block;padding:9px 0;text-decoration:none;border-bottom:1px solid var(--line)}
/* bottom nav mobile */
.bnav{display:none}
@media (max-width:760px){
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;font-size:11.5px;font-weight:600;color:var(--muted)}
  .bnav a svg{width:22px;height:22px}
  .bnav a[aria-current="page"]{color:var(--text)}
  .bnav a.primary{color:var(--ledger)}
  body{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font:700 15px var(--f-body);cursor:pointer;text-decoration:none;min-height:44px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.go{background:var(--ledger);color:#fff}.btn.go:hover{background:#0F6E2B}
.btn.wood{background:var(--wood);color:#FFFFFF}.btn.wood:hover{background:var(--wood-2)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.quiet{background:var(--surface-2);color:var(--text)}
.btn.sm{padding:8px 14px;min-height:36px;font-size:13.5px}
.btn.block{width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px}
.card.flat{border:0;background:var(--surface-2)}
.card h3{margin-bottom:.3em}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.demo{background:#E6F4EA;color:#0F5E27}
.tag.good{background:color-mix(in srgb,var(--ledger) 16%,transparent);color:var(--good)}
.tag.warn{background:#F9E0DA;color:var(--alert)}
.dark .tag{background:rgba(255,255,255,.1);color:#DDDDDD}
.note{border-left:4px solid var(--wood);background:var(--surface-2);padding:12px 16px;border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:14px;color:var(--muted);max-width:none}
.note strong{color:var(--text)}
.dark .note{background:rgba(255,255,255,.06);color:#CCCCCC}.dark .note strong{color:#fff}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-text);padding:clamp(40px,7vw,90px) 0 clamp(40px,6vw,70px);position:relative;overflow:hidden}
.hero .grid{grid-template-columns:1.1fr .9fr;align-items:center;gap:clamp(24px,5vw,64px)}
@media (max-width:900px){.hero .grid{grid-template-columns:1fr}}
.hero h1{margin-bottom:.25em}
.hero .lede{color:#CCCCCC}
.ladder{list-style:none;margin:0;padding:0;counter-reset:s}
.ladder li button{all:unset;box-sizing:border-box;display:flex;align-items:baseline;gap:14px;width:100%;cursor:pointer;padding:2px 0;font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(40px,7vw,78px);line-height:.98;color:rgba(246,247,244,.22);transition:color .2s}
.ladder li button small{font:600 14px var(--f-body);text-transform:none;letter-spacing:0;color:rgba(246,247,244,.45)}
.ladder li button:hover{color:rgba(246,247,244,.55)}
.ladder li button[aria-pressed="true"]{color:var(--wood-2)}
.ladder li button[aria-pressed="true"] small{color:#EDEDED}
.ladder li button:focus-visible{outline:3px solid var(--wood);outline-offset:2px}
.stage-panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-md);padding:16px 18px;margin-top:16px;min-height:120px}
.stage-panel ul{margin:6px 0 0;padding-left:18px;columns:2;font-size:14.5px;color:#DDDDDD}
.enter-lines{display:grid;gap:14px;margin-top:10px}
.enter-lines p{font-family:var(--f-display);font-size:clamp(22px,3vw,30px);font-weight:600;line-height:1.1;margin:0;max-width:none}
.enter-lines p span{color:var(--ledger-2)}

/* flywheel */
.fly{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-radius:var(--r-md);overflow:hidden}
.fly>div{padding:22px 18px;background:var(--surface);border-right:1px solid var(--line);position:relative}
.fly>div:last-child{border-right:0}
.fly .n{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:.8;color:var(--wood)}
.fly h3{text-transform:uppercase;margin-top:10px}
.fly ul{padding-left:16px;margin:0;font-size:14px;color:var(--muted)}
.fly-loop{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}
@media (max-width:900px){.fly{grid-template-columns:1fr}.fly>div{border-right:0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:56px 1fr;gap:4px 12px}.fly .n{font-size:48px;grid-row:span 2}.fly h3{margin:0}}

/* pathway cards */
.pcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 16px 14px;border-top:5px solid var(--c,var(--wood))}
.pcard:hover{border-color:var(--c,var(--wood))}
.pcard h3{font-size:22px;margin:0}
.pcard .steps{display:flex;gap:3px;margin-top:auto;padding-top:8px}
.pcard .steps i{flex:1;height:5px;border-radius:2px;background:var(--c,var(--wood));opacity:.25}
.pcard .steps i.on{opacity:1}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 13px;font:600 13.5px var(--f-body);cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.search{width:100%;max-width:520px;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font:16px var(--f-body)}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.lanes{grid-template-columns:1fr}}
.lane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.lane h3{text-transform:uppercase;color:var(--c,var(--wood))}
.lane ul{padding-left:18px;margin:0;font-size:14.5px}

/* player trading card */
.pc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pc .face{position:relative;background:linear-gradient(160deg,var(--navy) 0%,#262626 100%);color:#fff;aspect-ratio:4/3;display:flex;align-items:flex-end;padding:14px}
.pc .face .num{position:absolute;right:10px;top:-6px;font-family:var(--f-display);font-weight:800;font-size:110px;line-height:1;color:rgba(255,255,255,.09)}
.pc .face .sil{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:52%;opacity:.28}
.pc .face .who{position:relative}
.pc .face .who strong{display:block;font-family:var(--f-display);font-size:30px;line-height:1;text-transform:uppercase}
.pc .face .pos{font-size:13px;color:var(--wood-2);font-weight:700}
.pc .body{padding:14px;display:grid;gap:10px;flex:1}
.pc dl{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:0;font-size:13.5px}
.pc dt{color:var(--muted);font-size:12px}.pc dd{margin:0;font-weight:600}
.meter{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--ledger);border-radius:99px}
.meter.wood>i{background:var(--wood)}
.pc .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 14px}
.pc .acts .btn{padding:9px 8px;min-height:40px;font-size:13px}

/* profile */
.prof-head{background:var(--hero-bg);color:var(--hero-text);padding:32px 0}
.prof-head .wrap{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:end}
@media (max-width:760px){.prof-head .wrap{grid-template-columns:1fr}}
.avatar{width:128px;height:128px;border-radius:14px;background:linear-gradient(160deg,#2B2B2B,#0D0D0D);display:grid;place-items:center;font-family:var(--f-display);font-size:64px;font-weight:800;color:var(--wood-2);position:relative;overflow:hidden}
.avatar small{position:absolute;bottom:6px;font:600 10px var(--f-body);color:#A3A3A3}
.stat-strip{display:flex;flex-wrap:wrap;gap:22px;margin-top:10px}
.stat-strip div strong{display:block;font-family:var(--f-display);font-size:34px;line-height:1}
.stat-strip div span{font-size:13px;color:#B3B3B3}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:none}
.tabs button{all:unset;cursor:pointer;padding:12px 14px;font-weight:700;font-size:14.5px;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--text);border-color:var(--wood)}
.tabs button:focus-visible{outline:3px solid var(--wood)}
.timeline{list-style:none;padding:0;margin:0;border-left:3px solid var(--line)}
.timeline li{padding:0 0 16px 18px;position:relative}
.timeline li::before{content:"";position:absolute;left:-8px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--ledger)}
.timeline li.next::before{border-color:var(--line)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;font-size:13.5px;font-weight:600;background:var(--surface)}
.badge i{width:24px;height:24px;border-radius:50%;background:var(--wood);display:grid;place-items:center;font-style:normal;color:#FFFFFF;font-size:12px;font-weight:800}
.badge.off{opacity:.45}
.vid{aspect-ratio:16/9;background:repeating-linear-gradient(135deg,var(--surface-2) 0 12px,var(--surface) 12px 24px);border:1px dashed var(--line);border-radius:var(--r-md);display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:10px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.wall div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px}
.wall div b{display:block}
.wall div.sp{background:color-mix(in srgb,var(--ledger) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--ledger) 40%,transparent)}

/* calculators */
.calc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.calc-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.calc-head h3{margin:0}
.calc-body{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:820px){.calc-body{grid-template-columns:1fr}}
.calc-in{padding:20px;display:grid;gap:14px;align-content:start}
.calc-out{padding:20px;background:var(--surface-2);display:grid;gap:12px;align-content:start}
.field{display:grid;gap:5px}
.field label{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.field label output{font-family:var(--f-display);font-size:22px;line-height:1;color:var(--ledger)}
.field input[type=number],.field select,.field input[type=text],.field input[type=email],.field textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font:16px var(--f-body);width:100%}
input[type=range]{width:100%;accent-color:var(--ledger);height:28px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.three{grid-template-columns:1fr 1fr}}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,6vw,64px);line-height:.9}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--alert)}
.illus{font-size:12px;font-weight:700;color:#0F5E27;background:#E6F4EA;padding:4px 10px;border-radius:999px}
.bars{display:grid;gap:6px}
.bars .bar{display:grid;grid-template-columns:90px 1fr 70px;gap:8px;align-items:center;font-size:13px}
.bars .bar i{display:block;height:14px;border-radius:3px;background:var(--ledger)}
.bars .bar i.base{background:var(--wood)}

/* 40 hour grid */
.hours{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.hours span{aspect-ratio:1;border-radius:3px;background:var(--wood);display:grid;place-items:center;font-size:10px;font-weight:700;color:#FFFFFF}
.hours span.plus{box-shadow:inset 0 -6px 0 var(--ledger)}

/* support tiers */
.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.amounts button{all:unset;box-sizing:border-box;text-align:center;border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 4px;cursor:pointer;background:var(--surface);font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.amounts button small{display:block;font:600 11px var(--f-body);color:var(--muted);margin-top:4px}
.amounts button[aria-pressed="true"]{border-color:var(--ledger);background:color-mix(in srgb,var(--ledger) 12%,var(--surface))}
.amounts button:focus-visible{outline:3px solid var(--wood)}
.amounts button.spon{border-color:var(--wood)}
.threshold{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.threshold>div{padding:18px}
.threshold .line{width:6px;background:repeating-linear-gradient(var(--wood) 0 10px,transparent 10px 16px);padding:0}
.threshold .above{background:color-mix(in srgb,var(--wood) 12%,var(--surface))}
@media (max-width:700px){.threshold{grid-template-columns:1fr}.threshold .line{width:auto;height:6px;background:repeating-linear-gradient(90deg,var(--wood) 0 10px,transparent 10px 16px)}}

/* modal */
dialog{border:0;border-radius:var(--r-lg);padding:0;width:min(520px,94vw);max-height:92vh;background:var(--surface);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg-h{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-h h3{margin:0}
.dlg-b{padding:18px 20px;display:grid;gap:14px}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px}
.seg button{all:unset;flex:1;text-align:center;padding:8px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--ledger);margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:90;display:none;max-width:92vw}
.toast.show{display:block}

/* ladders / pipelines */
.pipe{list-style:none;margin:0;padding:0;display:grid;gap:0}
.pipe li{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:start;padding:12px 0;position:relative}
.pipe li::after{content:"";position:absolute;left:23px;top:52px;bottom:-4px;width:2px;background:var(--line)}
.pipe li:last-child::after{display:none}
.pipe li b.n{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:var(--wood-2);font-family:var(--f-display);font-size:22px}
.pipe li h3{margin:10px 0 2px;font-size:22px;text-transform:uppercase}
.pipe li p{margin:0;font-size:14.5px;color:var(--muted)}
.dark .pipe li::after{background:rgba(255,255,255,.15)}
.dark .pipe li b.n{background:var(--wood);color:#FFFFFF}
.dark .pipe li p{color:#B3B3B3}

.board{display:grid;gap:10px}
.opp{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.opp .kind{font-family:var(--f-display);font-weight:800;font-size:15px;text-transform:uppercase;padding:6px 10px;border-radius:var(--r-sm);background:var(--surface-2);min-width:84px;text-align:center}
.opp .kind.gig{color:var(--wood)}.opp .kind.contract{color:var(--ledger)}.opp .kind.job{color:#138A36}.opp .kind.route{color:#138A36}
@media (max-width:640px){.opp{grid-template-columns:1fr}.opp .kind{justify-self:start}}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:700}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
.status{font-weight:800;font-size:12px;padding:3px 8px;border-radius:4px}
.status.c{background:color-mix(in srgb,var(--ledger) 18%,transparent);color:var(--good)}
.status.p{background:#E6F4EA;color:#0F5E27}
.status.n{background:#F9E0DA;color:var(--alert)}

.dash{display:grid;grid-template-columns:230px 1fr;gap:20px}
@media (max-width:860px){.dash{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:2px}
@media (max-width:860px){.side{flex-direction:row;overflow-x:auto}}
.side button{all:unset;cursor:pointer;padding:9px 12px;border-radius:var(--r-sm);font-size:14.5px;font-weight:600;white-space:nowrap}
.side button[aria-pressed="true"]{background:var(--surface-2)}
.side button:focus-visible{outline:3px solid var(--wood)}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.metric strong{display:block;font-family:var(--f-display);font-size:40px;line-height:1}
.metric span{font-size:13.5px;color:var(--muted)}
.north{background:var(--navy);color:#fff;border-radius:var(--r-lg);padding:28px;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.north .big{color:var(--wood-2);font-size:clamp(72px,12vw,140px)}
@media (max-width:640px){.north{grid-template-columns:1fr}}
.compare th:first-child,.compare td:first-child{font-weight:700;min-width:130px}
footer{background:var(--hero-bg);color:#B3B3B3;padding:40px 0 30px;font-size:14px}
footer a{color:#E6E6E6}
footer .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px;margin-bottom:24px}
footer h4{color:#fff;font:700 14px var(--f-body);margin:0 0 8px}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.pagehead{padding:clamp(36px,6vw,70px) 0 clamp(24px,4vw,40px);background:var(--hero-bg);color:var(--hero-text)}
.pagehead .lede{color:#CCCCCC}
.crumbs{font-size:13.5px;margin-bottom:12px;opacity:.75}
.crumbs a{text-decoration:none}
.mt{margin-top:24px}.mt2{margin-top:40px}.mb0{margin-bottom:0}
.story{border:1.5px dashed var(--line);border-radius:var(--r-md);padding:18px;background:var(--surface)}
.story q{display:block;font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.15;color:var(--muted);quotes:none;margin-bottom:10px}
.qr{width:120px;height:120px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.grid>*,.dash>*,.lanes>*,.calc-body>*{min-width:0}
.tag{font-family:var(--f-body);text-transform:none;letter-spacing:0;vertical-align:middle}
.toast{border-radius:14px;text-align:center}
h1{font-size:clamp(46px,8.4vw,96px)}
.lanes.l3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fly.f6{grid-template-columns:repeat(6,1fr)}
@media (max-width:900px){.lanes.l3{grid-template-columns:1fr}.fly.f6{grid-template-columns:1fr}}
@media (max-width:520px){.brand span{display:none}.pc .face{aspect-ratio:16/9}.avatar{width:88px;height:88px;font-size:44px}}
h1,h2{overflow-wrap:break-word;hyphens:auto}

@media (max-width:640px){
 table.stack thead{display:none}
 table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
 table.stack tr{padding:14px 16px;border-bottom:1px solid var(--line)}

 table.stack td::before{content:attr(data-label);font-size:12.5px;font-weight:700;color:var(--muted);padding-top:2px}

 table.stack td:first-child::before{content:none}
 .card table.stack tr{padding:12px 0}
 .tscroll{overflow-x:visible}
}
table.stack td{overflow-wrap:break-word}

.wk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}

.wkslot b{display:block;font-weight:700}.wkslot span{color:var(--muted)}
.wkslot.c{background:color-mix(in srgb,var(--ledger) 16%,var(--surface))}.wkslot.g{background:#E6F4EA;color:#0B3A1B}.wkslot.o{color:var(--muted)}
@media (max-width:1100px){.wk{grid-template-columns:1fr;gap:4px}.wkday{display:grid;grid-template-columns:48px 1fr;align-items:start;gap:8px}.wkday>b{margin:6px 0 0}.wkslot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.wkslot b{display:inline}}

.acro{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:18px}
.acro span{font:600 14px var(--f-body);color:#CCCCCC;display:flex;align-items:baseline;gap:5px}
.acro b{font-family:var(--f-display);font-size:26px;font-weight:800;color:var(--wood-2);line-height:1}
@media (max-width:520px){.acro{gap:4px 9px;flex-wrap:nowrap}.acro span{font-size:12px;gap:3px}.acro b{font-size:21px}}
.givebox{margin-top:12px}
.gbrow{display:flex;gap:6px;align-items:center;margin-top:6px}
.gbrow .disp{font-size:26px}
.gbrow input,.gbrow select{padding:9px 10px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font:16px var(--f-body);min-width:0}
.gbrow input{flex:1 1 90px}.gbrow select{flex:0 1 auto}
.pkgs{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}

.pkg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pkg:last-child{border-bottom:0}
.pkg b{font-family:var(--f-display);font-size:22px}
/* ===== Campus hero ===== */
.aeq-bar{display:flex;align-items:center;gap:14px;padding:12px var(--pad);background:linear-gradient(90deg,#0A0A0A,#1C1C1C 60%,#0A0A0A);color:#F3EFE6;text-decoration:none;border-bottom:1px solid rgba(45,190,96,.35);font-size:14.5px}
.aeq-bar b{color:#2DBE60;font-family:var(--f-display);font-size:20px;letter-spacing:.02em}
.aeq-badge{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2DBE60,#0F5E27);color:#111111;font:800 22px var(--f-display);box-shadow:0 0 0 3px rgba(45,190,96,.25)}
.aeq-go{margin-left:auto;white-space:nowrap;font-weight:700;color:#2DBE60}

/* ===================== SLEEK PASS ===================== */
:root{--f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--r-sm:8px;--r-md:14px;--r-lg:20px;
 --line:#E4E4E1;--surface-2:#F1F1EE;--bg:#F7F7F5;--muted:#5E6166;
 --shadow-1:0 1px 2px rgba(0,0,0,.04),0 6px 20px -10px rgba(0,0,0,.14);--shadow-2:0 2px 4px rgba(0,0,0,.05),0 18px 40px -18px rgba(0,0,0,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--line:#242424;--surface:#121212;--surface-2:#181818;--bg:#0A0A0A;--muted:#9C9C9C}}
:root[data-theme="dark"]{--line:#242424;--surface:#121212;--surface-2:#181818;--bg:#0A0A0A;--muted:#9C9C9C}
body{font-size:15.5px;letter-spacing:-.005em}
h1{font-weight:800;letter-spacing:-.01em}
h2{text-transform:none;font-weight:700;font-size:clamp(30px,4.2vw,48px);letter-spacing:-.015em;line-height:1}
h3{font-weight:700;letter-spacing:-.005em}
.lede{font-size:clamp(16px,1.7vw,19px);line-height:1.5}
section.band{padding:clamp(56px,8vw,104px) 0}

/* header */
.top{background:rgba(10,10,10,.82);backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
.top .wrap{height:64px}
.brand{font-size:22px;letter-spacing:.06em}.brand span{font-family:var(--f-body);font-weight:500;font-size:13px;letter-spacing:.01em;opacity:.6}
.topnav a{font-size:14px;font-weight:500;opacity:.72;padding:8px 12px;border-radius:999px;transition:opacity .15s,background .15s}
.topnav a:hover,.topnav a[aria-current="page"]{opacity:1;background:rgba(255,255,255,.07)}
.iconbtn{border-color:rgba(255,255,255,.16);border-radius:999px;padding:7px 14px;font-weight:600}

/* buttons */
.btn{border-radius:12px;font-weight:700;font-size:14.5px;letter-spacing:.005em;padding:12px 20px;transition:transform .12s,background .15s,box-shadow .15s}
.btn.go{box-shadow:0 6px 16px -8px rgba(19,138,54,.7)}
.btn.wood{box-shadow:0 6px 16px -8px rgba(19,138,54,.75)}.btn.wood:hover{background:#0F6E2B}
.btn.ghost{box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}.btn.ghost:hover{background:rgba(255,255,255,.07)}
.band:not(.dark) .btn.ghost,.card .btn.ghost{box-shadow:inset 0 0 0 1px var(--line)}
.btn.quiet{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}.btn.quiet:hover{background:var(--surface-2)}
.btn.sm{border-radius:10px;padding:8px 14px}
.btn:focus-visible{outline-offset:3px}

/* chips, tags */
.chip{border-color:var(--line);font-weight:600;font-size:13px;padding:7px 14px;transition:background .15s,border-color .15s}
.chip:hover{border-color:#BDBDBD}
.chip[aria-pressed="true"]{background:#111;color:#fff;border-color:#111}
.tag{font-weight:600;font-size:11.5px;letter-spacing:.02em;padding:3px 9px;background:var(--surface-2)}

/* cards */
.card,.pc,.calc,.pcard,.lane,.opp,.metric,.exit,.story,.ride-card,.tscroll{border-color:var(--line);box-shadow:var(--shadow-1)}
.card.flat{box-shadow:none;background:var(--surface-2)}
a.card,.pcard,.ride-card{transition:transform .18s ease,box-shadow .18s ease}
a.card:hover,.pcard:hover,.ride-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.pcard{border-top-width:3px}
.ride-card{border-top-width:3px}
.ride-card h3{font-size:24px;text-transform:none}
.metric strong{font-weight:700}
.big{font-weight:700;letter-spacing:-.01em}
.meter{height:6px;background:var(--surface-2)}
.calc-head{background:var(--surface)}.calc-out{background:var(--surface-2)}
.note{border-left-width:3px;border-left-color:#138A36;background:var(--surface-2);border-radius:0 12px 12px 0}
.dark .card{box-shadow:none}

/* lists / pipes */
.pipe li b.n{width:40px;height:40px;font-size:18px;background:#111;color:#fff;box-shadow:0 0 0 4px var(--bg)}
.pipe li{grid-template-columns:40px 1fr}.pipe li::after{left:19px;top:46px;width:1px}
.pipe li h3{text-transform:none;font-size:19px;margin:8px 0 2px}
.dark .pipe li b.n{background:#138A36;color:#fff;box-shadow:0 0 0 4px #0A0A0A}
.fly{box-shadow:var(--shadow-1)}.fly h3{text-transform:none}
.lane h3{font-size:15px;letter-spacing:.08em}

/* page heads */
.pagehead,.aeq-head,.prof-head{position:relative;overflow:hidden;background:radial-gradient(900px 400px at 85% -10%,rgba(19,138,54,.22),transparent 60%),radial-gradient(700px 360px at 0% 120%,rgba(19,138,54,.14),transparent 60%),#0A0A0A}
.pagehead h1,.aeq-head h1{margin-bottom:.15em}
.pagehead .wrap::after,.aeq-head .wrap>div:first-child::after{content:"";display:block;width:56px;height:3px;background:#138A36;border-radius:3px;margin-top:22px}
.crumbs{font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;opacity:.55}

/* campus */
.campus{background:radial-gradient(1100px 520px at 50% 0%,rgba(19,138,54,.16),transparent 60%),radial-gradient(900px 500px at 50% 100%,rgba(19,138,54,.10),transparent 60%),#070707}
.facade{background:repeating-linear-gradient(180deg,#F2F1EC 0 24px,#EAE8E2 24px 25px);border-left-color:#E0DDD5;border-right-color:#E0DDD5}
.floor{border-bottom:6px solid #DEDAD1;box-shadow:0 2px 0 #138A36 inset}
.plaque{background:#111;color:#fff;border-radius:6px;border-top:3px solid #138A36;box-shadow:0 6px 14px -8px rgba(0,0,0,.6)}
.plaque small{color:#2DBE60;opacity:1;letter-spacing:.18em}
.plaque b{font-weight:700;letter-spacing:.01em}
.plaque span{color:#BDBDBD;opacity:1}
.win{border-width:5px;border-radius:52px 52px 4px 4px/34px 34px 4px 4px}
.qlinks a{border-radius:14px;border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.04);backdrop-filter:blur(6px)}
.qlinks a:hover{border-color:#2DBE60;background:rgba(19,138,54,.12)}
.qlinks b{font-weight:700;letter-spacing:.03em}
.ql-h{color:#9C9C9C;letter-spacing:.2em}

/* bottom nav + footer */
.bnav{background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top-color:var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bnav{background:rgba(12,12,12,.9)}}
.bnav a[aria-current="page"]{color:#138A36}.bnav a.primary{color:#138A36}
footer{background:#070707;border-top:1px solid #1C1C1C}
footer h4{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px;color:#9C9C9C}
footer a{color:#DADADA;text-decoration:none}footer a:hover{color:#fff}
.pc .face{background:radial-gradient(400px 200px at 80% 0%,rgba(19,138,54,.35),transparent 60%),#0E0E0E}
.avatar{background:radial-gradient(120px 80px at 70% 0%,rgba(19,138,54,.4),transparent 70%),#151515}
dialog{box-shadow:0 30px 80px -20px rgba(0,0,0,.5);border:1px solid var(--line)}
input[type=number],input[type=text],input[type=email],input[type=tel],input[type=search],select,textarea{border-radius:10px!important;border-width:1px!important;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#111!important;box-shadow:0 0 0 3px rgba(19,138,54,.18)}
.aeq-head .wrap>div:first-child::after{content:none}
.aeq-head .lede::after{content:"";display:block;width:56px;height:3px;background:#138A36;border-radius:3px;margin-top:20px}
.exits{align-items:start}.exit{border-left-width:3px}

/* ===== GREEN-DOMINANT PASS: red only as a rare accent ===== */
:root{--wood:#138A36;--wood-2:#2DBE60;--alert:#C8102E;--red:#D81E3A}
.btn.wood{background:#138A36;color:#fff}.btn.wood:hover{background:#0F6E2B}
.btn.go{background:#0F6E2B}.btn.go:hover{background:#0B5A23}
.chip[aria-pressed="true"]{background:#138A36;border-color:#138A36;color:#fff}
.chip:hover{border-color:#2DBE60}
.card,.pc,.calc,.pcard,.lane,.metric,.exit,.story,.opp,.tscroll{border-color:color-mix(in srgb,#138A36 22%,var(--line))}
input:focus,select:focus,textarea:focus{border-color:#138A36!important;box-shadow:0 0 0 3px rgba(19,138,54,.2)}
.neg{color:#C8102E}.status.n{color:#C8102E}
/* the few reds */
.brand b{color:var(--red)}
.acro b{color:var(--red)}
.pagehead .wrap::after,.aeq-head .lede::after{background:var(--red)}
.qaxis-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);margin:18px 0 8px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qcard{background:var(--surface);border:1px solid color-mix(in srgb,#138A36 25%,var(--line));border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow-1);border-top:4px solid #138A36}
.qcard.q-B,.qcard.q-I{background:linear-gradient(180deg,rgba(19,138,54,.08),transparent 60%),var(--surface)}
.qhead{display:flex;gap:14px;align-items:center}
.qletter{flex:none;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:#111;color:#2DBE60;font:800 40px/1 var(--f-display)}
.qhead h3{margin:0;font-size:24px}.qside{font-size:12.5px;font-weight:700;color:#138A36}
.qlead{font:700 20px/1.2 var(--f-display);margin:14px 0 6px}
.qcard h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.qcard ul{margin:0;padding-left:18px;font-size:14.5px}.qcard li{margin:3px 0}
@media (max-width:700px){.qgrid{grid-template-columns:1fr}.qaxis-top{display:none}.qcard .qside::before{content:""}}
.qlinks a{border-color:rgba(45,190,96,.45);background:rgba(19,138,54,.10)}
.qlinks a:hover{border-color:#2DBE60;background:rgba(19,138,54,.22)}
@media (max-width:700px){.q-E{order:0}.q-S{order:1}.q-B{order:2}.q-I{order:3}}
/* acronym: first letter big, bold, green — not repeated */
.acro{gap:6px 22px}
.acro span{gap:0;align-items:baseline;font:600 17px var(--f-body);color:#E6E6E6;letter-spacing:.01em}
.acro b{color:#2DBE60;font:900 34px/1 var(--f-display);margin-right:1px;letter-spacing:0}
@media (max-width:520px){.acro{gap:4px 12px;flex-wrap:wrap}.acro span{font-size:14px}.acro b{font-size:26px}}
/* ===== LOGO ===== */
.brand{align-items:center;gap:10px}
.brand .logo{width:44px;height:44px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.foot-brand{display:flex;align-items:center;gap:18px;margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid #1C1C1C}
.foot-brand .logo-lg{width:96px;height:96px;flex:none}
.foot-brand b{display:block;color:#fff;font:700 24px var(--f-display);letter-spacing:.02em}
.foot-brand span{color:#9C9C9C;font-size:13.5px}
.pagehead::before,.aeq-head::before,.prof-head::before{content:"";position:absolute;right:-60px;top:50%;width:min(46vw,420px);aspect-ratio:1;transform:translateY(-50%);background:var(--logo) center/contain no-repeat;opacity:.13;pointer-events:none}
.pagehead .wrap,.aeq-head .wrap,.prof-head .wrap{position:relative;z-index:1}
.dlg-h h3::before{content:"";display:inline-block;width:28px;height:28px;margin-right:10px;vertical-align:-7px;background:var(--logo) center/contain no-repeat}
@media (max-width:520px){.brand .logo{width:38px;height:38px}.pagehead::before,.aeq-head::before,.prof-head::before{width:260px;right:-80px;opacity:.1}}
.brand span{white-space:nowrap}
/* header: logo + glowing green "Economic Development" */
.brand b{display:none}
.brand span{display:inline!important;opacity:1;color:#2DBE60;font:700 20px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;text-shadow:0 0 6px rgba(45,190,96,.75),0 0 18px rgba(45,190,96,.45),0 0 34px rgba(19,138,54,.35);animation:edglow 3.2s ease-in-out infinite}
@keyframes edglow{0%,100%{text-shadow:0 0 6px rgba(45,190,96,.7),0 0 16px rgba(45,190,96,.4),0 0 30px rgba(19,138,54,.3)}50%{text-shadow:0 0 8px rgba(45,190,96,.95),0 0 24px rgba(45,190,96,.6),0 0 44px rgba(19,138,54,.45)}}
@media (max-width:520px){.brand span{font-size:16px;letter-spacing:.05em}}
@media (prefers-reduced-motion:reduce){.brand span{animation:none}}
.plan-sec{margin-top:16px;scroll-margin-top:80px}
.plan-body p,.plan-body li{font-size:15px}.plan-body ul,.plan-body ol{padding-left:20px}
textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:15px var(--f-body);width:100%}
.mamba{display:flex;flex-wrap:wrap;gap:16px;align-items:center;border-left:4px solid #138A36}.mamba-badge{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:#111;color:#2DBE60;font:800 30px/1 var(--f-display);flex:none}

function fundOf(type,id){
 if(type==="init"){const i=initiative(id);return {type,id,name:i.name,who:i.who,goal:i.goal,raised:i.raised,sponsors:i.sponsors,supporters:i.supporters,wall:i.wall,covers:i.covers,cta:i.cta||"Support this"}}

 const c=coach(id);return {type,id,name:c.name+"\u2019s salary",who:c.role,goal:c.goal,raised:c.support,sponsors:c.sponsors,supporters:c.community,wall:c.wall,covers:c.focus,cta:"Fund "+c.name.replace("Coach ","")+"\u2019s salary"}
}
function salaryTotals(){return COACHES.reduce((a,c)=>({goal:a.goal+c.goal,raised:a.raised+c.support,sponsors:a.sponsors+c.sponsors,supporters:a.supporters+c.community}),{goal:0,raised:0,sponsors:0,supporters:0})}
function fundCard(f,opt={}){const pct=Math.min(100,Math.round(f.raised/f.goal*100)),need=Math.max(0,f.goal-f.raised),spNeeded=Math.ceil(need/40);
 const av=f.type==="coach"?`<div class="avatar" style="width:56px;height:56px;font-size:22px;flex:none" role="img" aria-label="Headshot placeholder">${initials(coach(f.id).name.replace("Coach ",""))}</div>`:`<div class="avatar" style="width:56px;height:56px;font-size:20px;flex:none" aria-hidden="true">${f.type==="init"?initials(f.name):"GT"}</div>`;
 return `<article class="card fund">
 <div class="row" style="gap:12px;flex-wrap:nowrap">${av}<div><h3 class="mb0">${esc(f.name)}</h3><span class="small muted">${esc(f.who)}</span></div></div>
 <div class="row mt" style="justify-content:space-between;align-items:baseline"><span class="big" style="font-size:44px">${money(f.raised)}</span><span class="small muted">of ${money(f.goal)} / month</span></div>
 <div class="meter" style="height:12px;margin:6px 0"><i style="width:${pct}%"></i></div>
 <p class="small mb0"><b>${pct}% funded.</b> ${need?`${money(need)} to go \u2014 that\u2019s <b>${spNeeded} more $40 sponsor${spNeeded>1?"s":""}</b>.`:"Fully funded this month."}</p>
 <p class="tiny muted">${f.sponsors} sponsors \u00b7 ${f.supporters} supporters <span class="tag demo">Demo figures</span></p>
 ${opt.covers!==false?`<p class="small muted">${esc(f.covers)}</p>`:""}
 ${opt.wall?`<h4 style="margin:10px 0 6px">Supporter wall</h4><div class="wall">${f.wall.slice(0,6).map(w=>`<div class="${w.spon?"sp":""}"><b>${esc(w.name)}</b>${w.spon?"Sponsor":"Supporter"} \u00b7 ${money(w.amt)}${w.spon?"/mo":""}</div>`).join("")}</div>`:""}
 <div class="row mt"><button class="btn ${f.type==="team"?"wood":"go"}" data-support="${f.type}:${f.id}">${esc(f.cta)}</button>${opt.link?`<a class="btn quiet sm" href="${opt.link}">Details</a>`:""}</div></article>`}
function salaryPool(){const s=salaryTotals(),pct=Math.min(100,Math.round(s.raised/s.goal*100));return `<article class="card fund"><div class="row" style="gap:12px;flex-wrap:nowrap"><div class="avatar" style="width:56px;height:56px;font-size:20px;flex:none" aria-hidden="true">$</div><div><h3 class="mb0">Coaches\u2019 salary fund</h3><span class="small muted">Coach Nick \u00b7 Coach Zeus \u00b7 Coach Cade</span></div></div>

function wireFundCalc(m){const F=$("#fcF",m);if(!F)return;const up=()=>{const [t,id]=F.value.split(":"),f=fundOf(t,id),n=+$("#fcN",m).value,a=+$("#fcA",m).value,tot=n*a,p=Math.min(100,Math.round(tot/f.goal*100));

(()=>{const o=ROUTES.player;ROUTES.player=id=>{let h=o(id);h=h.replace('<div role="tabpanel" id="tp-media" hidden aria-labelledby="tab-media">','<div role="tabpanel" id="tp-media" hidden aria-labelledby="tab-media"><p class="small">Film study, daily training and physical test prep live in <a href="'+MAMBA+'" target="_blank" rel="noopener">Mamba Workroom \u2197</a>.</p>');return afterHead(h)}})();
(()=>{const o=ROUTES[""];ROUTES[""]=()=>o().replace('<a class="btn quiet" href="#/sports">All 15 players</a>','<a class="btn quiet" href="#/sports">All 15 players</a><a class="btn quiet" href="'+MAMBA+'" target="_blank" rel="noopener">Mamba Workroom \u2197</a>')})();
(()=>{const o=ROUTES.proposal;ROUTES.proposal=id=>o(id).replace(/(Goose Tatum Sports Academy<\/td><td>[^<]*<\/td><td>[^<]*)/,'$1 \u00b7 <a href="'+MAMBA+'" target="_blank" rel="noopener">Mamba Workroom</a> for film, training and testing')})();
shell();route();
