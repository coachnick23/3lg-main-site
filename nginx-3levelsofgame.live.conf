# /etc/nginx/sites-available/3levelsofgame.live
# Symlink to sites-enabled after DNS is pointed at 37.27.242.186, then run:
#   certbot --nginx -d 3levelsofgame.live -d www.3levelsofgame.live

server {
    listen 80;
    listen [::]:80;
    server_name 3levelsofgame.live www.3levelsofgame.live;

    root /root/3lg-main-site/client/dist;
    index index.html;

    # API proxy to PM2-managed Express (port 3005)
    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets with long cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/3levelsofgame.live-access.log;
    error_log  /var/log/nginx/3levelsofgame.live-error.log;
}
